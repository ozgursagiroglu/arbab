name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS: arbab's fence is Claude Code's sandbox, which uses sandbox-exec there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # plugin/ is what a marketplace install copies: it must be the build of this commit.
      - name: plugin/ is up to date
        run: git diff --exit-code -- plugin
